name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install portlibs
        run: dkp-pacman -S --noconfirm --needed ppc-libvorbisidec ppc-libogg

      - name: Version
        id: ver
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) v="${GITHUB_REF#refs/tags/v}" ;;
            *) v="0.0.0-$(echo "$GITHUB_SHA" | cut -c1-7)" ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: make -j"$(nproc)" APP_VERSION=${{ steps.ver.outputs.version }}

      - name: Package for the Homebrew Channel
        run: |
          make dist APP_VERSION=${{ steps.ver.outputs.version }}
          mkdir -p dist/apps/FNFWii/tools
          cp README.md dist/apps/FNFWii/
          cp tools/convert.py tools/fnfatlas.py dist/apps/FNFWii/tools/
          apt-get update -qq && apt-get install -y -qq zip >/dev/null
          (cd dist && zip -qr ../FNFWii.zip apps)

      - uses: actions/upload-artifact@v4
        with:
          name: FNFWii
          path: FNFWii.zip
          if-no-files-found: error

  # Tags like v1.2.0 get their own release.
  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FNFWii
          path: out
      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          name: FNFWii ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Extract FNFWii.zip to the root of your SD card (or USB drive).

            The game's art, music and charts are not included. Build the data folder on a computer from the
            [Funkin assets](https://github.com/FunkinCrew/funkin.assets) with `apps/FNFWii/tools/convert.py`
            (Python 3 + Pillow) and copy it to `sd:/apps/FNFWii/data`:

                python3 convert.py funkin.assets data
          files: |
            out/FNFWii.zip

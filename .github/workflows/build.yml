name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          dkp-pacman -S --noconfirm --needed ppc-libvorbisidec ppc-libogg
          apt-get update -qq && apt-get install -y -qq git python3 python3-pil rsync zip ca-certificates >/dev/null

      - name: Version
        id: ver
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) v="${GITHUB_REF#refs/tags/v}" ;;
            *) v="0.0.0-$(echo "$GITHUB_SHA" | cut -c1-7)" ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build executable
        run: make -j"$(nproc)" APP_VERSION=${{ steps.ver.outputs.version }}

      - name: Fetch and convert game assets
        run: |
          git clone --depth 1 https://github.com/FunkinCrew/funkin.assets.git
          python3 tools/convert.py funkin.assets data_out
          rm -rf funkin.assets

      - name: Package for the Homebrew Channel
        run: |
          make dist APP_VERSION=${{ steps.ver.outputs.version }}
          cp README.md dist/apps/FNFWii/
          (cd dist && zip -qr ../FNFWii.zip apps)
          rm -rf data_out

      - uses: actions/upload-artifact@v4
        with:
          name: FNFWii
          path: FNFWii.zip
          if-no-files-found: error

  # Tags like v1.2.0 get their own release.
  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FNFWii
          path: out
      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          name: FNFWii ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Extract `FNFWii.zip` to the root of your SD card (or USB drive) and launch FNFWii from the Homebrew Channel.
          files: |
            out/FNFWii.zip
